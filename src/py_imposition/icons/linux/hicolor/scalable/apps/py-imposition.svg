<?xml version="1.0" encoding="UTF-8"?>
<!-- py-imposition icon: a sheet carrying pages 4 | 1 of a booklet, with a
     fold line and crop marks. All other icon files are made from this one
     by tools/icons.py. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7bc8"/>
      <stop offset="1" stop-color="#1f4f8a"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf3"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6ecf3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg)"/>

  <!-- crop marks and fold marks -->
  <g stroke="#d6e6fa" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M40 140 H72 M100 80 V112"/>
    <path d="M472 140 H440 M412 80 V112"/>
    <path d="M40 372 H72 M100 432 V400"/>
    <path d="M472 372 H440 M412 432 V400"/>
    <path d="M256 80 V112 M256 432 V400"/>
  </g>

  <!-- the sheet: two pages -->
  <rect x="100" y="152" width="312" height="232" fill="#0b2140" opacity="0.5" filter="url(#blur)"/>
  <rect x="100" y="140" width="156" height="232" fill="url(#left)"/>
  <rect x="256" y="140" width="156" height="232" fill="url(#right)"/>
  <path d="M256 150 V362" stroke="#9db0c6" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- page contents: a heading bar and text lines -->
  <g fill="#b9c7d8">
    <rect x="124" y="166" width="72" height="12" rx="6"/>
    <rect x="280" y="166" width="72" height="12" rx="6"/>
  </g>
  <g fill="#d3dce7">
    <rect x="124" y="330" width="108" height="9" rx="4.5"/>
    <rect x="124" y="348" width="80" height="9" rx="4.5"/>
    <rect x="280" y="330" width="108" height="9" rx="4.5"/>
    <rect x="280" y="348" width="80" height="9" rx="4.5"/>
  </g>

  <!-- page numbers: the last page on the left, the first on the right -->
  <g font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-weight="bold"
     font-size="128" text-anchor="middle">
    <text x="178" y="306" fill="#5b7697">4</text>
    <text x="334" y="306" fill="#e8730c">1</text>
  </g>
</svg>
