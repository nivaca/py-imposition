[project]
name = "py-imposition"
version = "0.1.0"
description = "CLI tool for 2-up booklet PDF imposition"
readme = "README.md"
authors = [
    { name = "Nicolas Vaughan", email = "nivaca@fastmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pikepdf>=10.18.0",
]

[project.scripts]
py-imposition = "py_imposition:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
