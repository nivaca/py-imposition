[project]
name = "py-imposition"
version = "0.8"
description = "PDF imposition toolkit: booklets, n-up, step and repeat, shuffling, bleeds, stamps, sequences and hot folders"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Nicolas Vaughan", email = "nivaca@fastmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pikepdf>=10.8",
    "reportlab>=4.4",
]

[project.scripts]
py-imposition = "py_imposition:main"
py-imposition-install = "py_imposition.install:main"

[project.gui-scripts]
py-imposition-gui = "py_imposition.gui:main"

[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.10",
    "pyside6-pdf>=6.10",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
