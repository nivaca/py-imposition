name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools used by the tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils qpdf \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v
